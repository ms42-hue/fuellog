<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FuelLog" />
  <meta name="theme-color" content="#080812" />
  <title>FuelLog</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; background: #080812; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    textarea:focus, input:focus { outline: none; }
    textarea { resize: none; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #1e1e35; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // ── Config ────────────────────────────────────────────────────────────────
    const DAILY_GOAL   = 2100;
    const PROTEIN_GOAL = 180;
    const CARB_GOAL    = 210;
    const FAT_GOAL     = 65;
    const GOAL_WEIGHT  = 220;
    const START_WEIGHT = 247;
    const ANTHROPIC_API_KEY = ""; // ← Paste your Anthropic API key here

    const MEAL_PERIODS = [
      { key: "breakfast",       label: "Breakfast",       emoji: "🌅", start: 5,  end: 10 },
      { key: "morning_snack",   label: "Morning Snack",   emoji: "☕", start: 10, end: 12 },
      { key: "lunch",           label: "Lunch",           emoji: "🌤️", start: 12, end: 15 },
      { key: "afternoon_snack", label: "Afternoon Snack", emoji: "🍎", start: 15, end: 18 },
      { key: "dinner",          label: "Dinner",          emoji: "🌙", start: 18, end: 21 },
      { key: "evening_snack",   label: "Evening Snack",   emoji: "🌃", start: 21, end: 29 },
    ];

    // ── Helpers ───────────────────────────────────────────────────────────────
    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function getMealPeriod(ts) {
      const h = new Date(ts).getHours();
      const adj = h < 5 ? h + 24 : h;
      return MEAL_PERIODS.find(p => adj >= p.start && adj < p.end) || MEAL_PERIODS[4];
    }
    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }
    function formatDateLabel(dk) {
      const [y,m,d] = dk.split("-").map(Number);
      const date = new Date(y, m-1, d);
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((today - date) / 86400000);
      if (diff === 0) return "Today";
      if (diff === 1) return "Yesterday";
      return date.toLocaleDateString([], { weekday:"short", month:"short", day:"numeric" });
    }

    // ── localStorage storage (replaces window.storage for standalone) ─────────
    const LS = {
      get: (key) => { try { const v = localStorage.getItem(key); if (!v) return null; try { return JSON.parse(v); } catch { return v; } } catch { return null; } },
      set: (key, val) => { try { localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val)); } catch {} },
      list: (prefix) => {
        try {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(prefix)) keys.push(k);
          }
          return keys;
        } catch { return []; }
      }
    };

    // ── Sub-components ────────────────────────────────────────────────────────
    function MacroBar({ label, current, goal, color }) {
      const pct = Math.min((current / goal) * 100, 100);
      const over = current > goal;
      return (
        <div style={{ marginBottom: 8 }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
            <span style={{ fontFamily:"'Space Mono',monospace", fontSize:9, letterSpacing:1, textTransform:"uppercase", color:"#555" }}>{label}</span>
            <span style={{ fontSize:10, color: over ? "#ff6b6b" : "#666" }}>{current}g / {goal}g</span>
          </div>
          <div style={{ height:5, background:"#1a1a2e", borderRadius:3, overflow:"hidden" }}>
            <div style={{ height:"100%", width:`${pct}%`, background: over ? "#ff6b6b" : color, borderRadius:3, transition:"width 0.4s", boxShadow: over ? "none" : `0 0 6px ${color}66` }} />
          </div>
        </div>
      );
    }

    function MessageBubble({ msg }) {
      const isUser = msg.role === "user";
      return (
        <div style={{ display:"flex", justifyContent: isUser ? "flex-end" : "flex-start", marginBottom:12, animation:"fadeUp 0.3s ease" }}>
          {!isUser && <div style={{ width:26, height:26, borderRadius:"50%", background:"linear-gradient(135deg,#7b5ea7,#4ecdc4)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, marginRight:8, flexShrink:0, marginTop:2 }}>✦</div>}
          <div style={{ maxWidth:"78%", padding:"10px 14px", borderRadius: isUser ? "18px 18px 4px 18px" : "18px 18px 18px 4px", background: isUser ? "linear-gradient(135deg,#7b5ea7,#5a3d8a)" : "#16162a", color:"#e8e8f8", fontSize:13, lineHeight:1.6, border: isUser ? "none" : "1px solid #2a2a45", whiteSpace:"pre-wrap" }}>
            {msg.content}
          </div>
        </div>
      );
    }

    function LogEntry({ entry, onDelete, readonly }) {
      return (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"7px 10px", background:"#0e0e1e", borderRadius:7, border:"1px solid #1e1e35", marginBottom:5 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:12, color:"#d0d0e8", fontWeight:500, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{entry.food}</div>
            <div style={{ fontSize:10, color:"#555", marginTop:1, fontFamily:"'Space Mono',monospace" }}>
              {entry.calories} kcal · P:{entry.protein}g · C:{entry.carbs}g · F:{entry.fat}g
              {entry.timestamp && <span style={{ color:"#333", marginLeft:5 }}>@ {formatTime(entry.timestamp)}</span>}
            </div>
          </div>
          {!readonly && <button onClick={() => onDelete(entry.id)} style={{ background:"none", border:"none", color:"#333", cursor:"pointer", fontSize:15, padding:"0 4px", transition:"color 0.2s" }} onMouseOver={e=>e.target.style.color="#ff6b6b"} onMouseOut={e=>e.target.style.color="#333"}>×</button>}
        </div>
      );
    }

    function MealSection({ period, entries, onDelete, readonly }) {
      const total = entries.reduce((s,e) => s + e.calories, 0);
      return (
        <div style={{ marginBottom:16 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:6 }}>
            <div style={{ display:"flex", alignItems:"center", gap:5 }}>
              <span style={{ fontSize:13 }}>{period.emoji}</span>
              <span style={{ fontSize:10, fontWeight:700, color:"#5a5a88", fontFamily:"'Space Mono',monospace", letterSpacing:1, textTransform:"uppercase" }}>{period.label}</span>
            </div>
            <span style={{ fontSize:10, color:"#444", fontFamily:"'Space Mono',monospace" }}>{total} kcal</span>
          </div>
          {entries.map(e => <LogEntry key={e.id} entry={e} onDelete={onDelete} readonly={readonly} />)}
        </div>
      );
    }

    function DayLogView({ entries, onDelete, readonly }) {
      if (!entries || entries.length === 0) return <div style={{ textAlign:"center", color:"#2a2a40", fontSize:13, marginTop:30, lineHeight:2 }}><div style={{ fontSize:28, marginBottom:6 }}>🍽️</div>No entries for this day.</div>;
      const grouped = MEAL_PERIODS.map(p => ({ period:p, entries: entries.filter(e => getMealPeriod(e.timestamp).key === p.key) })).filter(g => g.entries.length > 0);
      const totals = entries.reduce((a,e) => ({ cal:a.cal+e.calories, p:a.p+e.protein, c:a.c+e.carbs, f:a.f+e.fat }), { cal:0, p:0, c:0, f:0 });
      return (
        <>
          {grouped.map(({ period, entries:es }) => <MealSection key={period.key} period={period} entries={es} onDelete={onDelete} readonly={readonly} />)}
          <div style={{ padding:"10px 12px", background:"#0a0a18", borderRadius:8, border:"1px solid #181830", marginTop:4 }}>
            <div style={{ fontSize:9, color:"#333", fontFamily:"'Space Mono',monospace", letterSpacing:1, marginBottom:6 }}>DAILY TOTAL</div>
            <div style={{ display:"flex", justifyContent:"space-between" }}>
              {[{l:"Calories",v:totals.cal,u:"kcal",hi:totals.cal>DAILY_GOAL},{l:"Protein",v:totals.p,u:"g"},{l:"Carbs",v:totals.c,u:"g"},{l:"Fat",v:totals.f,u:"g"}].map(({l,v,u,hi}) => (
                <div key={l} style={{ textAlign:"center" }}>
                  <div style={{ fontSize:16, fontWeight:700, color: hi ? "#ff6b6b" : "#9090c0" }}>{v}</div>
                  <div style={{ fontSize:8, color:"#333", fontFamily:"'Space Mono',monospace" }}>{u}</div>
                  <div style={{ fontSize:8, color:"#2a2a3a", marginTop:1 }}>{l}</div>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    }

    function WeightChart({ weights }) {
      if (weights.length < 2) return null;
      const vals = weights.map(w => w.weight);
      const min = Math.min(...vals) - 3, max = Math.max(...vals) + 3;
      const W = 320, H = 80;
      const pts = weights.map((w,i) => ({ x: (i/(weights.length-1))*(W-20)+10, y: H-((w.weight-min)/(max-min))*(H-20)-10, ...w }));
      const path = pts.map((p,i) => `${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
      const area = `${path} L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`;
      const goalY = H - ((GOAL_WEIGHT-min)/(max-min))*(H-20)-10;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:H, overflow:"visible" }}>
          <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#7b5ea7" stopOpacity="0.25"/><stop offset="100%" stopColor="#7b5ea7" stopOpacity="0"/></linearGradient></defs>
          <path d={area} fill="url(#wg)" />
          <path d={path} fill="none" stroke="#7b5ea7" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
          {goalY > 0 && goalY < H && <line x1="10" y1={goalY} x2={W-10} y2={goalY} stroke="#4ecdc4" strokeWidth="1" strokeDasharray="4 3" opacity="0.4" />}
          {pts.map((p,i) => <g key={i}><circle cx={p.x} cy={p.y} r="3" fill="#7b5ea7"/>{i===pts.length-1&&<text x={p.x} y={p.y-7} textAnchor="middle" fontSize="9" fill="#b08edf" fontFamily="Space Mono,monospace">{p.weight}</text>}</g>)}
        </svg>
      );
    }

    function CalorieChart({ days }) {
      if (days.length === 0) return null;
      const W=320, H=70;
      const maxCal = Math.max(...days.map(d=>d.cal), DAILY_GOAL+300);
      const goalY = H-(DAILY_GOAL/maxCal)*(H-12)-4;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:H }}>
          {days.map((d,i) => {
            const slotW=(W-20)/days.length, barW=Math.max(6,slotW-4);
            const x=10+i*slotW+(slotW-barW)/2, barH=Math.max(2,(d.cal/maxCal)*(H-12));
            const over=d.cal>DAILY_GOAL;
            return <g key={i}><rect x={x} y={H-barH-4} width={barW} height={barH} rx="2" fill={over?"#ff6b6b22":"#7b5ea722"} stroke={over?"#ff6b6b99":"#7b5ea799"} strokeWidth="1"/>{i===days.length-1&&<text x={x+barW/2} y={H-barH-8} textAnchor="middle" fontSize="8" fill="#666" fontFamily="Space Mono,monospace">{d.cal}</text>}</g>;
          })}
          {goalY>0&&goalY<H&&<line x1="10" y1={goalY} x2={W-10} y2={goalY} stroke="#4ecdc4" strokeWidth="1" strokeDasharray="4 3" opacity="0.5"/>}
        </svg>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const [view, setView] = useState("chat");
      const [messages, setMessages] = useState([{ role:"assistant", content:"Hey! I'm your nutrition coach 👋\n\nTell me what you've eaten and I'll log the calories and macros. Try:\n\n• \"2 eggs and toast with butter\"\n• \"McDonald's Big Mac meal\"\n• \"handful of almonds\"\n\nGoal: 2,100 kcal/day toward 220 lbs." }]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [todayLog, setTodayLog] = useState([]);
      const [historyDays, setHistoryDays] = useState([]);
      const [weights, setWeights] = useState([]);
      const [weightInput, setWeightInput] = useState("");
      const [selectedDay, setSelectedDay] = useState(null);
      const [apiToken, setApiToken] = useState(null);
      const [showToken, setShowToken] = useState(false);
      const [shortcutFeedback, setShortcutFeedback] = useState("");
      const [apiKey, setApiKey] = useState(ANTHROPIC_API_KEY);
      const [showApiKey, setShowApiKey] = useState(false);
      const messagesEndRef = useRef(null);
      const TODAY = todayKey();

      useEffect(() => {
        // Load data
        const saved = LS.get(`day:${TODAY}`);
        if (saved) setTodayLog(saved);
        const pastKeys = LS.list("day:").filter(k => k !== `day:${TODAY}`).sort().reverse().slice(0,30);
        const days = pastKeys.map(k => ({ dateKey: k.replace("day:",""), entries: LS.get(k) || [] }));
        setHistoryDays(days.filter(d => d.entries.length > 0));
        const ws = LS.get("weights") || [];
        setWeights(ws);

        // API key
        const savedKey = localStorage.getItem("api-key");
        if (savedKey) setApiKey(savedKey.replace(/[^\x20-\x7E]/g, "").trim());

        // Token
        let token = LS.get("api-token");
        if (!token) {
          token = Array.from(crypto.getRandomValues(new Uint8Array(18))).map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,32);
          LS.set("api-token", token);
        }
        setApiToken(token);

        // Handle Shortcut push via URL hash
        if (window.location.hash.startsWith("#push")) {
          const params = new URLSearchParams(window.location.hash.replace("#push?",""));
          const inToken = params.get("token");
          const inWeight = parseFloat(params.get("w"));
          const inBf = parseFloat(params.get("bf"));
          if (inToken === token && inWeight > 50 && inWeight < 500) {
            const entry = { dateKey:TODAY, weight:inWeight, bodyFat:inBf||null, timestamp:Date.now(), source:"shortcut" };
            const updated = [...(ws.filter(x => x.dateKey!==TODAY)), entry].sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
            setWeights(updated);
            LS.set("weights", updated);
            setShortcutFeedback(`✓ Synced ${inWeight} lbs${inBf ? ` · ${inBf}% body fat` : ""} from Apple Health`);
            setView("weight");
            window.history.replaceState(null, "", window.location.pathname);
          } else {
            setShortcutFeedback("⚠ Invalid token — check your Shortcut setup");
          }
        }
      }, []);

      useEffect(() => { LS.set(`day:${TODAY}`, todayLog); }, [todayLog]);
      useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior:"smooth" }); }, [messages]);

      const totals = todayLog.reduce((a,e) => ({ calories:a.calories+e.calories, protein:a.protein+e.protein, carbs:a.carbs+e.carbs, fat:a.fat+e.fat }), { calories:0, protein:0, carbs:0, fat:0 });
      const calPct = Math.min((totals.calories/DAILY_GOAL)*100, 100);
      const calOver = totals.calories > DAILY_GOAL;
      const remaining = DAILY_GOAL - totals.calories;
      const latestWeight = weights.length > 0 ? weights[weights.length-1].weight : START_WEIGHT;

      async function sendMessage() {
        if (!input.trim() || loading) return;
        const key = (apiKey || localStorage.getItem("api-key") || "").replace(/[^\x20-\x7E]/g, "").trim();
        if (!key) { setShowApiKey(true); return; }
        const userMsg = input.trim();
        setInput("");
        setMessages(prev => [...prev, { role:"user", content:userMsg }]);
        setLoading(true);
        try {
          const logSummary = todayLog.length > 0 ? `Today's log:\n${todayLog.map(e=>`- ${e.food}: ${e.calories} kcal`).join("\n")}\nTotal: ${totals.calories}/${DAILY_GOAL} kcal` : "Nothing logged yet today.";
          const systemPrompt = `You are a nutrition coach for a 27yo male, ${latestWeight} lbs, 5'10", goal ${GOAL_WEIGHT} lbs. Daily target: ${DAILY_GOAL} kcal, protein ${PROTEIN_GOAL}g, carbs ${CARB_GOAL}g, fat ${FAT_GOAL}g.\n\n${logSummary}\n\nWhen user logs food: 1) Estimate calories & macros. 2) Brief feedback (2-3 sentences). 3) End with: FOOD_DATA:{"food":"...","calories":N,"protein":N,"carbs":N,"fat":N}\n\nSkip FOOD_DATA for general questions. Be concise and supportive.`;
          console.log("DEBUG key length:", key.length, "starts:", key.slice(0,15), "ends:", key.slice(-10));
          console.log("DEBUG key charCodes start:", [...key.slice(0,5)].map(c=>c.charCodeAt(0)));
          const res = await fetch("https://fuellog-proxy.matt-shep42.workers.dev/", {
            method:"POST",
            headers:{ "Content-Type":"application/json", "x-api-key": key, "anthropic-version":"2023-06-01" },
            body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000, system:systemPrompt, messages:[{ role:"user", content:userMsg }] })
          });
          const data = await res.json();
          if (!res.ok || data.error) {
            const errMsg = data.error?.message || data.error?.type || JSON.stringify(data);
            setMessages(prev => [...prev, { role:"assistant", content:`⚠️ API Error (${res.status}): ${errMsg}` }]);
            setLoading(false);
            return;
          }
          const fullText = data.content?.map(b=>b.text||"").join("") || "Something went wrong.";
          const match = fullText.match(/FOOD_DATA:(\{.*?\})/);
          const clean = fullText.replace(/FOOD_DATA:\{.*?\}/,"").trim();
          if (match) {
            try {
              const fd = JSON.parse(match[1]);
              const now = Date.now();
              setTodayLog(prev => [...prev, { ...fd, id:now, timestamp:now }]);
            } catch {}
          }
          setMessages(prev => [...prev, { role:"assistant", content:clean }]);
        } catch(err) {
          const key2 = (apiKey || localStorage.getItem("api-key") || "").replace(/[^\x20-\x7E]/g, "").trim();
          const debugInfo = [
            `❌ Error: ${err.name}: ${err.message}`,
            `Key loaded: ${key2 ? "YES (len=" + key2.length + ", starts=" + key2.slice(0,10) + "...)" : "NO KEY FOUND - raw: " + JSON.stringify(localStorage.getItem("api-key")?.slice(0,20))}`,
            `Key valid format: ${key2.startsWith("sk-ant-") ? "YES" : "NO - doesnt start with sk-ant-"}`,
            `Worker URL: https://fuellog-proxy.matt-shep42.workers.dev/`,
          ].join("\n");
          setMessages(prev => [...prev, { role:"assistant", content: debugInfo }]);
        }
        setLoading(false);
      }

      function deleteEntry(id) { setTodayLog(prev => prev.filter(e=>e.id!==id)); }
      function clearToday() { setTodayLog([]); setMessages([{ role:"assistant", content:"Day cleared! Fresh start 🌅\n\nWhat have you eaten today?" }]); }

      function logWeight() {
        const w = parseFloat(weightInput);
        if (!w || w < 100 || w > 400) return;
        const entry = { dateKey:TODAY, weight:w, timestamp:Date.now() };
        const updated = [...weights.filter(x=>x.dateKey!==TODAY), entry].sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
        setWeights(updated);
        LS.set("weights", updated);
        setWeightInput("");
      }

      const chartDays = historyDays.map(d => ({ dateKey:d.dateKey, cal:d.entries.reduce((s,e)=>s+e.calories,0) })).sort((a,b)=>a.dateKey.localeCompare(b.dateKey)).slice(-14);

      const TABS = [
        { key:"chat",    label:"Coach",   icon:"✦" },
        { key:"today",   label:"Today",   icon:"📋" },
        { key:"history", label:"History", icon:"📅" },
        { key:"weight",  label:"Weight",  icon:"⚖️" },
      ];

      const S = { // shared styles shorthand
        card: { background:"#0c0c1c", borderRadius:8, border:"1px solid #131325", padding:"12px", marginBottom:14 },
        label: { fontSize:10, color:"#383858", fontFamily:"'Space Mono',monospace", letterSpacing:1, textTransform:"uppercase", marginBottom:8 },
      };

      return (
        <div style={{ minHeight:"100vh", background:"#080812", fontFamily:"'Syne',sans-serif", color:"#e0e0f0", display:"flex", flexDirection:"column", maxWidth:480, margin:"0 auto" }}>

          {/* API Key Setup Modal */}
          {showApiKey && (
            <div style={{ position:"fixed", inset:0, background:"#000000cc", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center", padding:20 }}>
              <div style={{ background:"#0e0e1e", borderRadius:12, border:"1px solid #2a2a45", padding:20, width:"100%", maxWidth:360 }}>
                <div style={{ fontSize:14, fontWeight:700, marginBottom:8 }}>🔑 Anthropic API Key Required</div>
                <div style={{ fontSize:12, color:"#666", marginBottom:14, lineHeight:1.6 }}>
                  FuelLog uses Claude AI to estimate calories. You need a free Anthropic API key to use the Coach tab.{"\n\n"}
                  Get one at <span style={{ color:"#7b5ea7" }}>console.anthropic.com</span>
                </div>
                <input
                  type="password"
                  placeholder="sk-ant-..."
                  value={apiKey}
                  onChange={e => setApiKey(e.target.value)}
                  style={{ width:"100%", background:"#08081a", border:"1px solid #2a2a45", borderRadius:7, padding:"9px 12px", color:"#e0e0f0", fontSize:13, fontFamily:"'Space Mono',monospace", marginBottom:10 }}
                />
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={() => setShowApiKey(false)} style={{ flex:1, padding:"8px", background:"none", border:"1px solid #2a2a45", borderRadius:7, color:"#666", fontSize:12, cursor:"pointer" }}>Cancel</button>
                  <button onClick={() => { const clean = apiKey.replace(/[^ -~]/g, "").trim(); localStorage.setItem("api-key", clean); setApiKey(clean); setShowApiKey(false); sendMessage(); }} style={{ flex:2, padding:"8px", background:"linear-gradient(135deg,#7b5ea7,#4ecdc4)", border:"none", borderRadius:7, color:"white", fontSize:12, fontWeight:700, cursor:"pointer" }}>Save & Continue</button>
                </div>
              </div>
            </div>
          )}

          {/* Header */}
          <div style={{ padding:"14px 18px 10px", borderBottom:"1px solid #111122", background:"#08081299", backdropFilter:"blur(12px)", position:"sticky", top:0, zIndex:10 }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
              <div>
                <div style={{ fontSize:17, fontWeight:800, letterSpacing:-0.5 }}>Fuel<span style={{ color:"#7b5ea7" }}>Log</span></div>
                <div style={{ fontSize:10, color:"#383858", fontFamily:"'Space Mono',monospace" }}>{latestWeight} lbs → {GOAL_WEIGHT} lbs</div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <button onClick={() => setShowApiKey(true)} style={{ background:"none", border:"1px solid #1a1a30", borderRadius:5, color:"#383858", fontSize:9, padding:"3px 7px", cursor:"pointer", fontFamily:"'Space Mono',monospace" }}>⚙ API</button>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontSize:22, fontWeight:800, color: calOver ? "#ff6b6b" : remaining < 300 ? "#ffd93d" : "#4ecdc4" }}>{calOver ? `+${Math.abs(remaining)}` : remaining}</div>
                  <div style={{ fontSize:9, color:"#383858", fontFamily:"'Space Mono',monospace" }}>{calOver?"OVER":"KCAL LEFT"}</div>
                </div>
              </div>
            </div>
            <div style={{ height:6, background:"#0e0e1e", borderRadius:3, overflow:"hidden", marginBottom:8 }}>
              <div style={{ height:"100%", width:`${calPct}%`, borderRadius:3, transition:"width 0.5s", background: calOver?"linear-gradient(90deg,#ff6b6b,#ff4444)":calPct>85?"linear-gradient(90deg,#ffd93d,#ff9f43)":"linear-gradient(90deg,#7b5ea7,#4ecdc4)" }} />
            </div>
            <MacroBar label="Protein" current={totals.protein} goal={PROTEIN_GOAL} color="#4ecdc4" />
            <MacroBar label="Carbs"   current={totals.carbs}   goal={CARB_GOAL}    color="#ffd93d" />
            <MacroBar label="Fat"     current={totals.fat}     goal={FAT_GOAL}     color="#ff9f43" />
            <div style={{ display:"flex", gap:4, marginTop:10 }}>
              {TABS.map(t => (
                <button key={t.key} onClick={() => { setView(t.key); setSelectedDay(null); }} style={{ flex:1, padding:"5px 2px", borderRadius:7, border:"1px solid", borderColor: view===t.key?"#7b5ea7":"#131325", background: view===t.key?"#7b5ea715":"transparent", color: view===t.key?"#a07bd0":"#383858", fontSize:9, fontFamily:"'Space Mono',monospace", letterSpacing:0.5, textTransform:"uppercase", cursor:"pointer", transition:"all 0.2s" }}>
                  <div style={{ fontSize:12, marginBottom:1 }}>{t.icon}</div>{t.label}
                </button>
              ))}
            </div>
          </div>

          {/* Content */}
          <div style={{ flex:1, overflowY:"auto", padding:"16px 18px" }}>

            {/* CHAT */}
            {view === "chat" && (
              <div>
                {messages.map((m,i) => <MessageBubble key={i} msg={m} />)}
                {loading && (
                  <div style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 0" }}>
                    <div style={{ width:26, height:26, borderRadius:"50%", background:"linear-gradient(135deg,#7b5ea7,#4ecdc4)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11 }}>✦</div>
                    <div style={{ display:"flex", gap:3 }}>
                      {[0,1,2].map(i => <div key={i} style={{ width:5, height:5, borderRadius:"50%", background:"#7b5ea7", animation:"pulse 1.2s ease infinite", animationDelay:`${i*0.2}s` }} />)}
                    </div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>
            )}

            {/* TODAY */}
            {view === "today" && (
              <div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
                  <div style={{ fontSize:10, color:"#383858", fontFamily:"'Space Mono',monospace", letterSpacing:1, textTransform:"uppercase" }}>Today's Log</div>
                  {todayLog.length > 0 && <button onClick={clearToday} style={{ background:"none", border:"1px solid #131325", borderRadius:5, color:"#484868", fontSize:9, padding:"3px 8px", cursor:"pointer", fontFamily:"'Space Mono',monospace" }}>CLEAR</button>}
                </div>
                <DayLogView entries={todayLog} onDelete={deleteEntry} readonly={false} />
              </div>
            )}

            {/* HISTORY */}
            {view === "history" && !selectedDay && (
              <div>
                <div style={{ ...S.label, marginBottom:12 }}>Calorie History</div>
                {chartDays.length > 1 && (
                  <div style={S.card}>
                    <div style={{ fontSize:9, color:"#333", fontFamily:"'Space Mono',monospace", letterSpacing:1, marginBottom:8 }}>LAST {chartDays.length} DAYS · <span style={{ color:"#4ecdc455" }}>— goal</span></div>
                    <CalorieChart days={chartDays} />
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"#2a2a3a", fontFamily:"'Space Mono',monospace", marginTop:6 }}>
                      <span>{formatDateLabel(chartDays[0].dateKey)}</span>
                      <span style={{ color:"#484868" }}>Avg: {Math.round(chartDays.reduce((s,d)=>s+d.cal,0)/chartDays.length)} kcal</span>
                      <span>{formatDateLabel(chartDays[chartDays.length-1].dateKey)}</span>
                    </div>
                  </div>
                )}
                {historyDays.length === 0 ? (
                  <div style={{ textAlign:"center", color:"#2a2a40", fontSize:13, marginTop:30, lineHeight:2 }}><div style={{ fontSize:28, marginBottom:6 }}>📅</div>No history yet.<br />Keep logging daily!</div>
                ) : historyDays.map(({ dateKey, entries }) => {
                  const cal = entries.reduce((s,e)=>s+e.calories,0), over=cal>DAILY_GOAL, pct=Math.min((cal/DAILY_GOAL)*100,100);
                  return (
                    <div key={dateKey} onClick={() => setSelectedDay(dateKey)} style={{ padding:"10px 12px", background:"#0c0c1c", borderRadius:9, border:"1px solid #131325", marginBottom:7, cursor:"pointer", transition:"border-color 0.2s" }} onMouseOver={e=>e.currentTarget.style.borderColor="#7b5ea7"} onMouseOut={e=>e.currentTarget.style.borderColor="#131325"}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                        <div style={{ fontSize:13, fontWeight:700 }}>{formatDateLabel(dateKey)}</div>
                        <div style={{ fontSize:12, fontFamily:"'Space Mono',monospace", color: over?"#ff6b6b":"#4ecdc4" }}>{cal} <span style={{ color:"#333", fontSize:10 }}>/ {DAILY_GOAL}</span></div>
                      </div>
                      <div style={{ height:3, background:"#0e0e1e", borderRadius:2, overflow:"hidden", marginBottom:5 }}>
                        <div style={{ height:"100%", width:`${pct}%`, background: over?"#ff6b6b":"#7b5ea7", borderRadius:2 }} />
                      </div>
                      <div style={{ fontSize:10, color:"#2a2a3a" }}>{entries.length} items · tap to view →</div>
                    </div>
                  );
                })}
              </div>
            )}

            {view === "history" && selectedDay && (() => {
              const day = historyDays.find(d=>d.dateKey===selectedDay);
              return (
                <div>
                  <button onClick={() => setSelectedDay(null)} style={{ background:"none", border:"none", color:"#7b5ea7", cursor:"pointer", fontSize:12, fontFamily:"'Space Mono',monospace", marginBottom:14, padding:0 }}>← Back</button>
                  <div style={{ fontSize:15, fontWeight:700, marginBottom:14 }}>{formatDateLabel(selectedDay)}</div>
                  <DayLogView entries={day?.entries||[]} onDelete={()=>{}} readonly={true} />
                </div>
              );
            })()}

            {/* WEIGHT */}
            {view === "weight" && (
              <div>
                <div style={S.label}>Weight Tracker</div>
                {shortcutFeedback && (
                  <div style={{ padding:"8px 12px", background: shortcutFeedback.startsWith("✓")?"#0a1e18":"#1e0a0a", border:`1px solid ${shortcutFeedback.startsWith("✓")?"#4ecdc455":"#ff6b6b55"}`, borderRadius:8, marginBottom:12, fontSize:12, color: shortcutFeedback.startsWith("✓")?"#4ecdc4":"#ff6b6b", fontFamily:"'Space Mono',monospace" }}>
                    {shortcutFeedback}
                  </div>
                )}
                <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                  {[{l:"Current",v:latestWeight,u:"lbs"},{l:"Goal",v:GOAL_WEIGHT,u:"lbs"},{l:"To Go",v:Math.max(0,latestWeight-GOAL_WEIGHT).toFixed(1),u:"lbs"}].map(({l,v,u}) => (
                    <div key={l} style={{ flex:1, textAlign:"center", padding:"10px 6px", background:"#0c0c1c", borderRadius:8, border:"1px solid #131325" }}>
                      <div style={{ fontSize:18, fontWeight:800, color:"#9898c8" }}>{v}</div>
                      <div style={{ fontSize:8, color:"#383858", fontFamily:"'Space Mono',monospace" }}>{u}</div>
                      <div style={{ fontSize:9, color:"#2a2a3a", marginTop:2 }}>{l}</div>
                    </div>
                  ))}
                </div>
                <div style={S.card}>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"#2a2a3a", fontFamily:"'Space Mono',monospace", marginBottom:6 }}>
                    <span>START {START_WEIGHT} lbs</span><span>GOAL {GOAL_WEIGHT} lbs</span>
                  </div>
                  <div style={{ height:7, background:"#0a0a18", borderRadius:3, overflow:"hidden" }}>
                    <div style={{ height:"100%", width:`${Math.min(100,Math.max(0,((START_WEIGHT-latestWeight)/(START_WEIGHT-GOAL_WEIGHT))*100))}%`, background:"linear-gradient(90deg,#7b5ea7,#4ecdc4)", borderRadius:3, transition:"width 0.5s" }} />
                  </div>
                  <div style={{ fontSize:10, color:"#7b5ea7", marginTop:5, textAlign:"center", fontFamily:"'Space Mono',monospace" }}>
                    {Math.max(0,Math.round(((START_WEIGHT-latestWeight)/(START_WEIGHT-GOAL_WEIGHT))*100))}% to goal
                  </div>
                </div>
                {weights.length > 1 && (
                  <div style={S.card}>
                    <div style={{ fontSize:9, color:"#2a2a3a", fontFamily:"'Space Mono',monospace", letterSpacing:1, marginBottom:8 }}>TREND · <span style={{ color:"#4ecdc444" }}>— = goal</span></div>
                    <WeightChart weights={weights} />
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"#2a2a3a", fontFamily:"'Space Mono',monospace", marginTop:4 }}>
                      <span>{formatDateLabel(weights[0].dateKey)}</span>
                      <span>{formatDateLabel(weights[weights.length-1].dateKey)}</span>
                    </div>
                  </div>
                )}
                <div style={S.card}>
                  <div style={S.label}>Log Today's Weight Manually</div>
                  <div style={{ display:"flex", gap:8 }}>
                    <input type="number" value={weightInput} onChange={e=>setWeightInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&logWeight()} placeholder="e.g. 244.5" style={{ flex:1, background:"#08081a", border:"1px solid #1e1e38", borderRadius:7, padding:"8px 12px", color:"#e0e0f0", fontSize:14, fontFamily:"'Syne',sans-serif" }} />
                    <button onClick={logWeight} style={{ padding:"8px 18px", background:"linear-gradient(135deg,#7b5ea7,#4ecdc4)", border:"none", borderRadius:7, color:"white", fontWeight:700, fontSize:12, cursor:"pointer" }}>Log</button>
                  </div>
                </div>

                {/* iOS Shortcut Setup */}
                <div style={{ ...S.card, border:"1px solid #1e1e38" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                    <div style={S.label}>🍎 Apple Health Auto-Sync</div>
                    <button onClick={() => setShowToken(p=>!p)} style={{ background:"none", border:"1px solid #1e1e38", borderRadius:5, color:"#484868", fontSize:9, padding:"2px 8px", cursor:"pointer", fontFamily:"'Space Mono',monospace" }}>{showToken?"HIDE":"SETUP"}</button>
                  </div>
                  {!showToken ? (
                    <div style={{ fontSize:11, color:"#383858", lineHeight:1.6 }}>Auto-push weight from your Runstar-R5 scale via Apple Health each morning. Tap <strong style={{ color:"#6060a0" }}>SETUP</strong> for instructions.</div>
                  ) : (
                    <div>
                      {[
                        {n:"1",t:"New Shortcut",d:'Open Shortcuts app → tap + → name it "FuelLog Sync"'},
                        {n:"2",t:"Get Body Weight",d:'"Find Health Samples" → Type: Body Mass → Sort: Newest First → Limit: 1'},
                        {n:"3",t:"Get Body Fat %",d:'"Find Health Samples" → Type: Body Fat % → Sort: Newest First → Limit: 1 (optional)'},
                        {n:"4",t:"Open URL",d:'Add "Open URL" → paste your URL below, replacing WEIGHT and BODYFAT with the sample values from steps 2 & 3'},
                        {n:"5",t:"Automate it",d:'Automation tab → + → Time of Day → 7:00 AM daily → run this shortcut → disable "Ask Before Running"'},
                      ].map(({n,t,d}) => (
                        <div key={n} style={{ display:"flex", gap:10, marginBottom:8, alignItems:"flex-start" }}>
                          <div style={{ width:18, height:18, borderRadius:"50%", background:"#7b5ea733", border:"1px solid #7b5ea755", display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, color:"#7b5ea7", fontFamily:"'Space Mono',monospace", flexShrink:0, marginTop:2 }}>{n}</div>
                          <div>
                            <div style={{ fontSize:11, fontWeight:700, color:"#8080b0", marginBottom:1 }}>{t}</div>
                            <div style={{ fontSize:10, color:"#484868", lineHeight:1.5 }}>{d}</div>
                          </div>
                        </div>
                      ))}
                      <div style={{ marginTop:10 }}>
                        <div style={{ fontSize:9, color:"#383858", fontFamily:"'Space Mono',monospace", letterSpacing:1, marginBottom:5 }}>YOUR URL (tap to copy)</div>
                        <div onClick={() => { const url=`${window.location.href.split("#")[0]}#push?token=${apiToken}&w=WEIGHT&bf=BODYFAT`; navigator.clipboard.writeText(url).then(()=>setShortcutFeedback("✓ URL copied!")).catch(()=>{}); }} style={{ background:"#080818", border:"1px solid #2a2a45", borderRadius:6, padding:"8px 10px", fontFamily:"'Space Mono',monospace", fontSize:9, color:"#6060a0", wordBreak:"break-all", cursor:"pointer", lineHeight:1.6 }}>
                          {window.location.href.split("#")[0]}#push?token=<span style={{ color:"#a07bd0" }}>{apiToken}</span>&w=<span style={{ color:"#4ecdc4" }}>WEIGHT</span>&bf=<span style={{ color:"#ffd93d" }}>BODYFAT</span>
                        </div>
                        <div style={{ fontSize:9, color:"#2a2a3a", marginTop:4, fontFamily:"'Space Mono',monospace" }}>⚠ Keep this URL private — it grants write access to your weight data</div>
                      </div>
                    </div>
                  )}
                </div>

                {weights.length > 0 && (
                  <div>
                    <div style={{ fontSize:9, color:"#2a2a3a", fontFamily:"'Space Mono',monospace", letterSpacing:1, textTransform:"uppercase", marginBottom:8 }}>History</div>
                    {[...weights].reverse().slice(0,20).map((w,i) => (
                      <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 10px", background: i===0?"#0f0f22":"transparent", borderRadius:6, marginBottom:2 }}>
                        <div>
                          <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                            <span style={{ fontSize:12, color:"#484868" }}>{formatDateLabel(w.dateKey)}</span>
                            {w.source==="shortcut" && <span style={{ fontSize:8, background:"#1a1a35", border:"1px solid #7b5ea733", borderRadius:3, padding:"1px 4px", color:"#7b5ea7", fontFamily:"'Space Mono',monospace" }}>🍎 AUTO</span>}
                          </div>
                          {w.bodyFat && <div style={{ fontSize:9, color:"#383858", fontFamily:"'Space Mono',monospace", marginTop:1 }}>Body Fat: {w.bodyFat}%</div>}
                        </div>
                        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                          {i > 0 && (() => { const prev=[...weights].reverse()[i-1], diff=(w.weight-prev.weight).toFixed(1), color=diff<0?"#4ecdc4":diff>0?"#ff6b6b":"#444"; return <span style={{ fontSize:10, color, fontFamily:"'Space Mono',monospace" }}>{diff>0?"+":""}{diff}</span>; })()}
                          <span style={{ fontSize:13, fontWeight:700, color: i===0?"#a07bd0":"#484868", fontFamily:"'Space Mono',monospace" }}>{w.weight}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Chat input */}
          {view === "chat" && (
            <div style={{ padding:"10px 18px 18px", borderTop:"1px solid #111122", background:"#08081299", backdropFilter:"blur(12px)" }}>
              <div style={{ display:"flex", gap:8, alignItems:"flex-end", background:"#0c0c1e", borderRadius:12, border:"1px solid #181830", padding:"9px 11px" }}>
                <textarea value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}} placeholder="Log food or ask a question..." rows={1} style={{ flex:1, background:"none", border:"none", color:"#e0e0f0", fontSize:13, fontFamily:"'Syne',sans-serif", lineHeight:1.5, maxHeight:80, overflowY:"auto" }} onInput={e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,80)+"px";}} />
                <button onClick={sendMessage} disabled={loading||!input.trim()} style={{ width:32, height:32, borderRadius:"50%", border:"none", background: loading||!input.trim()?"#131325":"linear-gradient(135deg,#7b5ea7,#4ecdc4)", color: loading||!input.trim()?"#2a2a3a":"white", fontSize:15, cursor: loading||!input.trim()?"default":"pointer", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.2s", flexShrink:0 }}>↑</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
